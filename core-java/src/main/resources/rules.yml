# 検知ルールの閾値（MVP 要件定義 2. 検知ルール）
# 以下をすべて満たした確定足を「押し目買い候補」とする。
rules:
  buy-dip:
    # RSI(14) がこの値より小さい
    rsi-below: 35
    # 終値が SMA(50) より上（中期は上昇トレンド内）
    # 5 分足では SMA20 と SMA50 の差がほとんど開かず、下の SMA20 乖離の条件と同時に成立しない
    # （2025-09〜2026-09 の BTCUSDT で 0 件）。そのため外している。
    # 外した場合の 1 年の実績: 通知 69 回（60 分の重複抑止後）、うち 1 時間以内に +0.8% 到達 42%
    require-close-above-sma50: false
    # 終値の SMA(20) からの乖離率（%）がこの値以下（短期の押し目）
    sma20-deviation-at-most: -1.5
    # 出来高が 出来高MA(20) のこの倍率より大きい
    volume-ratio-above: 1.5
