spring:
  application:
    name: core-java
  config:
    # リポジトリ直下の .env（Git 管理外）を読む。OS の環境変数があればそちらが優先
    import:
      - classpath:rules.yml
      - optional:file:../.env[.properties]
  datasource:
    url: jdbc:sqlite:${DB_PATH:../data/trade.db}
    driver-class-name: org.sqlite.JDBC
    hikari:
      # SQLite は同時に 1 本しか書き込めないので接続も 1 本に絞る
      maximum-pool-size: 1
      connection-init-sql: PRAGMA journal_mode=WAL
  sql:
    init:
      mode: always

market:
  symbol: ${SYMBOL:BTCUSDT}
  timeframe: ${TIMEFRAME:5m}
  backfill-days: ${BACKFILL_DAYS:365}
  sync-interval: 60s
  binance:
    rest-base-url: https://api.binance.com
    ws-base-url: wss://stream.binance.com:9443
    request-pause: 200ms
    max-retries: 5
    stream-idle-timeout: 90s

notify:
  # 同一銘柄・同一方向のシグナルはこの時間内に再通知しない
  cooldown: ${NOTIFY_COOLDOWN_MINUTES:60}m
  # 足の確定からこれ以上たった候補は通知しない（停止明けに古い候補を送らない）
  max-delay: 10m
  discord:
    # 空なら通知せず、signals への保存とログだけ行う
    webhook-url: ${DISCORD_WEBHOOK_URL:}
    max-retries: 3
    # true なら起動後最初の評価結果を、ルール一致に関係なくテスト通知として送る
    send-test-on-startup: ${NOTIFY_TEST:false}

logging:
  file:
    name: ${LOG_PATH:../logs}/core-java.log
  level:
    com.example.trade: INFO
